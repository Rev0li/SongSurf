# SongSurf — Docker Compose
#
# Architecture (SSF-16) : un seul service, toujours actif.
#   Caddy (portail, forward_auth + X-Proxy-Token) ──► [SongSurf :SONGSURF_PORT]
#
# Usage:
#   make secrets    ← generate .env + .secrets
#   make up         ← build + start
#   make logs       ← stream logs
#   make down       ← stop
#
# Config split:
#   .env     → non-secret config (DEPLOY_TARGET, ports, limits…)
#   .secrets → all key material (chmod 600, never commit)

services:

  # ── SongSurf — vérifie lui-même la porte du portail ───────────────────────
  songsurf:
    container_name: songsurf
    build:
      context: .
      dockerfile: Dockerfile
    image: songsurf:latest
    restart: unless-stopped
    # tini en PID 1 : relaie SIGTERM (arrêt propre) et ramasse les ffmpeg zombies
    init: true

    env_file:
      - .env
      - .secrets

    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Paris
      - FLASK_PORT=${SONGSURF_PORT:-8081}
      - FLASK_SECRET_KEY=${SONGSURF_FLASK_SECRET_KEY:?SONGSURF_FLASK_SECRET_KEY is required}
      - DEV_MODE=${DEV_MODE:-false}
      - SONGSURF_PROXY_SECRET=${SONGSURF_PROXY_SECRET:-}
      - REVAUTH_HOME_URL=${REVAUTH_HOME_URL:-}

    volumes:
      - ./data/music:/data/music
      - ./data/temp:/data/temp
      - ./data/cookies:/data/cookies   # cookies YouTube par utilisateur (<uid>.txt)
      - ./data/state:/data/state       # SQLite : file, quotas, exports ZIP (SSF-03)
      - ./logs:/app/logs

    healthcheck:
      # $$ : FLASK_PORT est lu dans le conteneur, pas dans le .env du host (R2)
      test: ["CMD-SHELL", "curl -f http://localhost:$${FLASK_PORT:-8081}/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
