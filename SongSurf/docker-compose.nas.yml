services:
  songsurf:
    network_mode: host
    ports: []
    user: root
    # host network : SongSurf écoute sur SONGSURF_PORT de toutes les interfaces.
    # Le pare-feu du NAS doit le borner au LAN / Tailscale (jamais le WAN) ;
    # sans X-Proxy-Token valide, toute requête est refusée (401).
    volumes:
      # Bibliothèque admin = musique Jellyfin, montée sur le dossier de l'UUID admin
      # (clé de stockage SSF-03). ADMIN_UID est dans .env.
      - /volume1/media/music:/data/music/${ADMIN_UID:?ADMIN_UID is required (UUID du compte admin du portail)}
