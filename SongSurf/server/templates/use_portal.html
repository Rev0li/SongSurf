<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SongSurf — Passe par le portail</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #f5f7ff; font-family: sans-serif;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .box { text-align: center; padding: 0 16px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p  { color: #a8acc4; font-size: 14px; margin: 0 0 20px; }
    a  { color: #7c3aed; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🔐 Passe par le portail</h1>
    <p>SongSurf n'est accessible qu'en passant par le portail, une fois connecté.</p>
    {% if portal_url %}<a href="{{ portal_url }}">Aller au portail</a>{% endif %}
  </div>
</body>
</html>
